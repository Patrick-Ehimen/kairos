[workspace]
resolver = "3"
members = ["modules/*"]

[workspace.package]
edition = "2024"
rust-version = "1.94"
license = "MIT"
repository = "https://github.com/0xOse/kairos"

[workspace.dependencies]
kairos-core = { path = "modules/core" }
kairos-mempool = { path = "modules/mempool" }
kairos-dex = { path = "modules/dex" }
kairos-state = { path = "modules/state" }
kairos-sim = { path = "modules/sim" }
kairos-detector = { path = "modules/detector" }
kairos-server = { path = "modules/server" }
alloy = { version = "2", features = ["full"] }
thiserror = "2"
serde = { version = "1", features = ["derive"] }
toml = "0.9"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "time"] }
futures = "0.3"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

[profile.release]
lto = "thin"
codegen-units = 1
