# Base mainnet (OP Stack).
#
# Checked against a live Base node (2026-11-25): eth_chainId, contract code
# at the Multicall3 address, and symbol() = "WETH", decimals() = 18 at
# wrapped_native.

name = "base"
chain_id = 8453
multicall3 = "0xcA11bde05977b3631167028862bE2a173976CA11"
wrapped_native = "0x4200000000000000000000000000000000000006"

# L1 data and operator fees. Checked against a live Base node (2026-11-26):
# contract code at both predeploys; the oracle reports isFjord, isIsthmus
# and isJovian all true; and getL1FeeUpperBound matched Kairos's own
# computation at four sizes, with every parameter read at one block.
[data_fee]
kind = "op_stack"
gas_price_oracle = "0x420000000000000000000000000000000000000F"
l1_block = "0x4200000000000000000000000000000000000015"

# Execution-gas estimates for ranking routes before simulation. They are
# estimates, not measurements: replace them with gas used from simulations of
# real Kairos routes once those run. Execution gas only: the L1 data fee is
# priced separately from [data_fee].
[gas]
tx_base = 21000
flashloan = 80000
executor_overhead = 30000
per_initialized_tick = 5000
constant_product = 60000
concentrated_liquidity = 180000
